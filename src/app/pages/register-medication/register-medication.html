<div class="bg-base-100 rounded-box shadow-md p-8 w-full max-w-3xl mx-auto">
  <h2 class="text-xl font-semibold opacity-70 mb-6">Registrar Medicação</h2>

  <form class="space-y-5">
    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Nome do Medicamento</span>
      </label>
      <input
        type="text"
        placeholder="Ex: Dipirona, Omeprazol, Paracetamol"
        class="input input-bordered w-full placeholder-gray-400"
      />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Dosagem</span>
      </label>
      <input
        type="text"
        placeholder="Ex: 500mg, 20mg, 1 comprimido"
        class="input input-bordered w-full placeholder-gray-400"
      />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Frequência</span>
      </label>
      <input
        type="text"
        placeholder="Ex: a cada 8 horas, 1x ao dia, antes das refeições"
        class="input input-bordered w-full placeholder-gray-400"
      />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Validade</span>
      </label>
      <input type="date" class="input input-bordered w-full" />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Horário de Uso</span>
      </label>
      <input type="time" class="input input-bordered w-full" />
    </div>

    <button class="btn btn-primary w-full mt-4">Registrar Medicação</button>
  </form>
</div>
