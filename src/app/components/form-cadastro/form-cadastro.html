<div class="w-full max-w-md bg-white mb-10 rounded-2xl shadow-lg p-8">
  <h2 class="text-2xl font-semibold text-center mb-6">Criar Conta</h2>

  <form class="space-y-5">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome completo</label>
      <input
        id="name"
        name="name"
        type="text"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-400"
        placeholder="Digite seu nome completo"
      />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-400"
        placeholder="Digite seu email"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-400"
        placeholder="Crie uma senha"
      />
    </div>

    <div>
      <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1"
        >Confirmar senha</label
      >
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-400"
        placeholder="Confirme sua senha"
      />
    </div>

    <div>
      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
      >
        Cadastrar
      </button>
    </div>
  </form>

  <div class="flex justify-center mt-6 text-sm">
    <a routerLink="/" class="text-gray-600 hover:underline">Já possui conta? Entrar</a>
  </div>
</div>
