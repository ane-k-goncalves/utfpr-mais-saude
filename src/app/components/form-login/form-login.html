<div class="w-full max-w-md bg-white mb-10 rounded-2xl shadow-lg p-8">
  <h2 class="text-2xl font-semibold text-center mb-6">Login</h2>

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        #emailCtrl="ngModel"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-400"
        placeholder="Digite seu email"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        #passwordCtrl="ngModel"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-400"
        placeholder="Digite sua senha"
      />
    </div>

    <div>
      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
      >
        Entrar
      </button>
    </div>
  </form>

  <div class="flex justify-between items-center mt-6 text-sm">
    <a href="#" class="text-indigo-600 hover:underline">Esqueceu a senha?</a>
    <a routerLink="cadastro" class="text-gray-600 hover:underline">Criar conta</a>
  </div>
</div>
