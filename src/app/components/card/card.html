<div class="card bg-base-100 image-full w-full h-full shadow-sm mx-auto">
  <figure>
    <img [src]="infocards.imagem" />
  </figure>
  <div class="card-body">
    <h2 class="card-title">{{ infocards.titulo }}</h2>
    <p>
      {{ infocards.descricao }}
    </p>
    <div class="card-actions justify-end">
      <button class="btn btn-primary" (click)="navegar()">Clique aqui</button>
    </div>
  </div>
</div>
